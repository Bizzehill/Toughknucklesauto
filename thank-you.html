<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Tough Knuckles Automotive</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="images/logo.jpg">
    <style>
        :root {
            --black: #0A1628;
            --red:   #FF1A2E;
            --white: #FFFFFF;
            --gray:  #AAAAAA;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }
        img { height: 120px; width: auto; margin-bottom: 32px; }
        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        h1 span { color: var(--red); }
        p {
            color: var(--gray);
            font-size: 1.1rem;
            line-height: 1.7;
            max-width: 480px;
            margin-bottom: 12px;
        }
        .divider {
            width: 60px;
            height: 3px;
            background: var(--red);
            margin: 24px auto;
        }
        a {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 36px;
            background: var(--red);
            color: var(--white);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.2s;
        }
        a:hover { background: #CC1525; }
    </style>
</head>
<body>
    <img src="images/logo.jpg" alt="Tough Knuckles Automotive Logo">
    <h1>Message <span>Received!</span></h1>
    <div class="divider"></div>
    <p>Thank you for reaching out to Tough Knuckles Automotive.</p>
    <p>We'll get back to you as soon as possible. If you need immediate assistance, give us a call.</p>
    <a href="tel:+14193925926">(419) 392-5926</a>
    <a href="/" style="background: transparent; border: 2px solid #555; color: #aaa; margin-left: 12px;">Back to Home</a>
